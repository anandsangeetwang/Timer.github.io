<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>瑜珈計時器</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6519">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="瑜珈計時器"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>*{box-sizing:border-box}:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);height:100%}body{margin:0;font-size:14px}img{max-width:100%}
/* Layout: landscape = groups | items+controls | stage ; portrait phone = single column with drawer */
:root{
  --bg:#ffffff;
  --ink:#16191d;
  --ink-soft:#4d5560;
  --panel:#c8d0da;      /* grey-blue pills & frames */
  --panel-2:#dde3ea;
  --sage:#a3babd;       /* group cards */
  --arrow:#959ea9;
  --pink:#f79a9a;       /* active / countdown */
  --pink-deep:#e57373;
  --green:#2f6519;      /* gear, settings */
  --leaf-a:#c3e89c;     /* side drawers */
  --leaf-b:#e7e79c;
  --leaf-ink:#2d3a1c;
  --blue:#6f98c8;       /* add buttons */
  --white:#ffffff;
  --shadow:0 6px 24px rgba(30,40,55,.18);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --leftw:240px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{height:100%;position:relative}
[hidden]{display:none!important}
.page{position:absolute;inset:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- MAIN (landscape) ---------- */
.main{display:grid;height:100%;
  grid-template-columns:var(--leftw) 190px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"left items stage" "left controls stage";
  column-gap:18px;padding-right:14px;transition:grid-template-columns .25s}
.main.left-collapsed{--leftw:52px}
.topbar{display:none}

/* groups pane */
.groups{grid-area:left;background:var(--panel);border-radius:0 22px 22px 0;display:flex;flex-direction:column;
  position:relative;min-height:0;padding:8px 10px}
.groups-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:46px}
.gear{width:40px;height:40px;color:var(--green);display:grid;place-items:center}
.gear svg{width:34px;height:34px}
.tri{width:100%;height:36px;display:grid;place-items:center;color:var(--arrow)}
.tri svg{width:56px;height:36px}
.tri.down svg{transform:rotate(180deg)}
.group-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:14px;padding:6px 0}
.group-list::-webkit-scrollbar{display:none}
.group{background:var(--sage);border-radius:18px;padding:8px 6px 12px;display:flex;flex-direction:column;gap:6px}
.group-top{display:flex;align-items:center;justify-content:center;position:relative;min-height:28px}
.group-name{color:var(--white);font-weight:700;font-size:17px;padding:2px 30px;text-align:center;letter-spacing:.04em}
.plus{width:30px;height:30px;color:var(--blue);display:grid;place-items:center}
.plus svg{width:26px;height:26px}
.group-top .plus{position:absolute;right:2px;top:0}
.carousel{display:flex;align-items:center;gap:2px}
.carousel .side{width:24px;height:44px;color:var(--arrow);display:grid;place-items:center;flex:none}
.carousel .side:disabled{opacity:.3;cursor:default}
.timer-pill{flex:1;min-width:0;background:var(--panel-2);border-radius:18px;padding:12px 10px;text-align:center;font-size:17px;
  line-height:1.4;position:relative;border:3px solid transparent;word-break:break-all}
.timer-pill.current{border-color:var(--pink)}
.timer-pill .pos{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.pencil{position:absolute;right:-6px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--white);color:var(--ink-soft);
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pencil svg{width:15px;height:15px}
.groups-foot{display:flex;flex-direction:column;align-items:stretch}
.groups-foot .add-group{align-self:flex-end;display:flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;font-size:14px;padding:4px}
.collapse-btn{position:absolute;right:-14px;top:50%;transform:translateY(-50%);width:28px;height:56px;border-radius:0 14px 14px 0;
  background:var(--panel);color:var(--ink-soft);display:grid;place-items:center;z-index:2}
.left-collapsed .group-list,.left-collapsed .groups-foot,.left-collapsed .groups-head .tri{display:none}
.left-collapsed .groups-head{justify-content:center}
.left-collapsed .collapse-btn svg{transform:rotate(180deg)}

/* items pane */
.items{grid-area:items;display:flex;flex-direction:column;align-items:center;min-height:0;padding-top:2px}
.flower{width:56px;height:36px;color:var(--pink);flex:none;display:grid;place-items:center}
.flower svg{width:56px;height:36px}
.flower.down svg{transform:rotate(180deg)}
.item-list{flex:1;min-height:0;width:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:12px;padding:8px 2px;scroll-behavior:smooth}
.item-list::-webkit-scrollbar{display:none}
.item-pill{background:var(--panel);border-radius:22px;padding:10px 14px;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.item-pill.current{background:var(--pink)}
.item-pill .mode{font-size:12px;color:var(--ink-soft);margin-left:4px}

.controls{grid-area:controls;display:flex;justify-content:center;gap:18px;padding:10px 0 14px}
.ctl{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--ink)}
.ctl svg{width:26px;height:26px}
.ctl.play{background:var(--pink);width:66px;height:66px}
.ctl.play svg{width:30px;height:30px}

/* stage */
.stage{grid-area:stage;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(90px,30%);gap:14px;padding:10px 0 14px;min-height:0;position:relative}
.stage-head{display:flex;align-items:flex-start;gap:14px}
.title-pill{flex:1;min-width:0;background:var(--panel);border-radius:26px;padding:8px 18px;font-size:clamp(20px,3vw,32px);font-weight:800;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.timebox{position:relative;flex:none;width:170px;height:62px}
.time-pill{position:absolute;right:20px;top:0;height:58px;min-width:150px;padding:0 12px;border-radius:0 0 0 0;display:grid;place-items:center;
  font-size:28px;font-weight:800;background:var(--pink);z-index:2;border-radius:6px 6px 16px 16px;transition:background .3s}
.count-pill{position:absolute;right:-8px;top:40px;width:76px;height:76px;border-radius:50%;background:var(--panel);display:grid;place-items:center;
  font-size:19px;z-index:1;transition:background .3s}
.timebox.up .time-pill{background:var(--panel);z-index:1}
.timebox.up .count-pill{background:var(--pink);z-index:2;font-weight:800}
.image-wrap{background:var(--panel);border-radius:26px;padding:12px;min-height:0;display:flex}
.image-box{flex:1;background:var(--white);border-radius:18px;display:grid;place-items:center;overflow:hidden;min-height:0}
.image-box img{width:100%;height:100%;object-fit:contain}
.placeholder{color:var(--arrow);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;text-align:center;padding:10px}
.placeholder svg{width:72px;height:72px}
.desc{background:var(--panel);border-radius:22px;padding:10px 18px;overflow-y:auto;min-height:0}
.desc summary{list-style:none;font-weight:700;text-align:center;font-size:16px;cursor:default}
.desc summary::-webkit-details-marker{display:none}
.desc p{margin:6px 0 0;font-size:16px;line-height:1.7;white-space:pre-wrap;-webkit-user-select:text;user-select:text}

/* side drawers */
.tabs{position:absolute;right:-14px;top:110px;bottom:14px;display:flex;flex-direction:column;justify-content:space-between;z-index:5;pointer-events:none}
.tab-wrap{position:relative;display:flex;align-items:flex-start;pointer-events:auto;flex:none}
.tab-btn i{display:block;font-style:normal;line-height:1.25}
.tab-btn{background:linear-gradient(180deg,var(--leaf-a),var(--leaf-b));color:var(--leaf-ink);
  font-size:16px;padding:12px 7px;flex:none;white-space:nowrap;border-radius:14px 0 0 14px;opacity:.95;box-shadow:-2px 2px 8px rgba(0,0,0,.08)}
.drawer{position:absolute;right:100%;top:0;margin-right:-1px;background:linear-gradient(160deg,var(--leaf-a),var(--leaf-b));border-radius:16px 0 16px 16px;
  padding:12px 14px;width:236px;box-shadow:var(--shadow);color:var(--leaf-ink)}
.tab-wrap.bottom .drawer{top:auto;bottom:0;border-radius:16px 16px 0 16px}
.drawer h3{margin:0 0 8px;font-size:15px}
.ratio-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ratio-val{flex:1;background:var(--arrow);color:var(--white);font-weight:800;font-size:22px;text-align:center;padding:4px 0;border-radius:4px;border:0;width:100%}
.mini{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.6);display:grid;place-items:center;font-weight:800;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.kv b{color:var(--white);text-shadow:0 0 2px rgba(0,0,0,.35);font-size:15px}
.kv .note{grid-column:1/-1;font-size:12px;color:var(--ink-soft)}
.mode-opt{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:16px;width:100%;text-align:left;justify-content:flex-start}
.mode-opt > span:last-child{flex:1;min-width:0;display:block}
.box{width:26px;height:26px;border:3px solid #7d8a63;border-radius:4px;background:rgba(255,255,255,.45);display:grid;place-items:center;flex:none}
.mode-opt[aria-checked="true"] .box::after{content:"";width:12px;height:12px;background:var(--green);border-radius:2px}
.mode-opt small{display:block;font-size:11px;color:var(--ink-soft)}

/* flash overlay */
.flash{position:fixed;inset:0;background:var(--pink);pointer-events:none;opacity:0;z-index:90}
.flash.on{animation:flash 1.2s ease-out}
@keyframes flash{0%,30%,60%{opacity:.85}15%,45%,100%{opacity:0}}

/* ---------- EDIT ---------- */
.edit{display:grid;height:100%;grid-template-columns:220px 230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"list head head" "list form media";gap:12px 18px;padding:10px 16px 12px 56px;background:var(--bg)}
.edit-head{grid-area:head;display:flex;align-items:center;gap:12px;justify-content:flex-end}
.name-input{flex:1;min-width:0;font-size:clamp(22px,3.2vw,36px);font-weight:800;text-align:right;border:0;border-bottom:2px dashed var(--panel);padding:4px;background:transparent;color:var(--ink)}
.save-btn{background:var(--pink);border-radius:22px;padding:10px 22px;font-weight:800;font-size:16px;flex:none}
.edit-list{grid-area:list;display:flex;flex-direction:column;min-height:0}
.edit-items{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.erow{display:flex;align-items:center;gap:6px}
.handle{width:30px;height:40px;color:var(--arrow);display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.erow.dragging{opacity:.6}
.erow .item-pill{flex:1;min-width:0}
.erow.sel .item-pill{background:var(--pink)}
.add-item{display:flex;align-items:center;gap:6px;color:var(--arrow);font-weight:800;font-size:16px;padding:10px 4px}
.add-item svg{width:24px;height:24px;color:var(--blue)}
.form{grid-area:form;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.form-box{background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.ititle{width:100%;font-size:20px;font-weight:800;text-align:center;border:0;border-radius:10px;padding:6px;background:var(--white);color:var(--ink)}
.modes{display:flex;gap:12px}
.mode-c{width:84px;height:84px;border-radius:50%;background:var(--sage);color:var(--white);font-weight:800;font-size:15px}
.mode-c[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
.spins{display:flex;align-items:center;gap:4px}
.spin{display:flex;flex-direction:column;align-items:center}
.spin button{color:var(--white);width:36px;height:22px;display:grid;place-items:center}
.spin input{width:44px;height:40px;background:var(--arrow);color:var(--white);font-weight:800;font-size:22px;text-align:center;border:0;border-radius:4px}
.spin.digit input{width:34px}
.colon{font-weight:900;font-size:24px}
.unit{font-weight:800;font-size:18px;margin-left:6px}
.sound-h{font-weight:800;margin-top:4px}
.srow{display:flex;align-items:center;gap:8px;width:100%}
.srow label{flex:none;width:36px;font-size:15px}
.srow select{flex:1;min-width:0;border:0;border-radius:14px;padding:6px 10px;font-size:15px;background:var(--white);color:var(--ink)}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--panel);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--green)}
.toggle[aria-checked="true"]::after{left:23px}
.del-item{font-size:13px;color:var(--pink-deep);text-decoration:underline;padding:4px}
.media{grid-area:media;display:grid;grid-template-rows:minmax(0,1fr) minmax(100px,32%);gap:12px;min-height:0}
.media .image-box{position:relative;cursor:pointer;border:12px solid var(--panel);border-radius:26px}
.img-actions{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.chip{background:rgba(255,255,255,.92);border-radius:14px;padding:5px 12px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.desc-edit{background:var(--panel);border-radius:22px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.desc-edit label{font-weight:700;text-align:center}
.desc-edit textarea{flex:1;border:0;border-radius:12px;padding:8px;font-size:15px;resize:none;background:rgba(255,255,255,.75);color:var(--ink);min-height:60px}
.edit-sub{display:none}

/* ---------- SETTINGS ---------- */
.settings{display:grid;grid-template-columns:minmax(0,1fr);height:100%;overflow-y:auto;padding:16px 16px 24px 64px;background:var(--bg)}
.settings-inner{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.settings h1{margin:0;text-align:center;font-size:32px}
.card{background:var(--panel-2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:17px}
.card p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.soon{border:2px dashed var(--panel)}
.soon ul{margin:0;padding-left:20px;font-size:14px;line-height:1.8;color:var(--ink-soft)}

/* ---------- back handle ---------- */
.back-handle{position:fixed;z-index:60;width:40px;height:84px;background:linear-gradient(180deg,var(--leaf-a),var(--leaf-b));color:var(--leaf-ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:grab;box-shadow:var(--shadow);font-size:13px;line-height:1.1}
.back-handle.left{border-radius:0 16px 16px 0}
.back-handle.right{border-radius:16px 0 0 16px}
.back-handle.dragging{border-radius:16px;opacity:.9;cursor:grabbing}
.back-handle span{writing-mode:vertical-rl;letter-spacing:.2em}
.back-handle svg{width:18px;height:18px}
.back-handle.right svg{transform:rotate(180deg)}

/* ---------- dialog / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,26,34,.42);display:grid;place-items:center;z-index:100;padding:16px}
.dialog{background:var(--white);border-radius:20px;padding:20px;width:min(420px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.dialog h3{margin:0;font-size:19px}
.dialog .body{font-size:15px;line-height:1.7;color:var(--ink-soft)}
.dialog .body ol{margin:6px 0;padding-left:20px}
.dialog input[type=text]{font-size:17px;padding:8px 10px;border:2px solid var(--panel);border-radius:10px;width:100%;background:var(--white);color:var(--ink)}
.dialog .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dialog .btns button{padding:9px 18px;border-radius:18px;background:var(--panel);font-weight:700}
.dialog .btns button.primary{background:var(--pink)}
.dialog label.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);
  padding:10px 18px;border-radius:20px;font-size:14px;z-index:110}
.haptic{position:fixed;left:-100px;top:-100px;opacity:0;pointer-events:none}
.backdrop{display:none}

/* ---------- small landscape (phones sideways) ---------- */
@media (max-height:500px) and (orientation:landscape){
  .main{--leftw:200px;grid-template-columns:var(--leftw) 150px minmax(0,1fr)}
  .main.left-collapsed{--leftw:52px}
  .item-pill{font-size:15px;padding:7px 10px}
  .timer-pill{font-size:15px;padding:8px}
  .ctl{width:46px;height:46px}.ctl.play{width:52px;height:52px}
  .title-pill{font-size:20px}
  .time-pill{font-size:22px;height:46px;min-width:120px}
  .timebox{width:140px;height:50px}
  .count-pill{width:60px;height:60px;top:32px;font-size:16px}
  .stage{grid-template-rows:auto minmax(0,1fr) minmax(70px,26%)}
  .tabs{top:80px}
  .tab-btn{font-size:13px;padding:8px 4px}
}

/* ---------- PORTRAIT PHONE ---------- */
@media (max-width:700px){
  .main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;padding:0;column-gap:0;
    grid-template-areas:"top" "head" "image" "split" "items" "desc" "controls";
    grid-template-rows:auto auto auto auto auto auto minmax(max-content,1fr);row-gap:10px;overflow-y:auto;overflow-x:hidden}
  .main > .controls{align-self:end}
  .splitter{grid-area:split;height:18px;margin-block:-6px}
  .main > *{margin-inline:16px}
  .topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding-top:6px}
  .topbar .tname{flex:1;min-width:0;text-align:center;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:42px;height:42px;display:grid;place-items:center;color:var(--ink-soft)}
  .icon-btn svg{width:28px;height:28px}
  .icon-btn.gear-t{color:var(--green)}
  .stage{display:contents}
  .stage-head{grid-area:head;flex-direction:column-reverse;align-items:stretch;gap:10px}
  .timebox{width:100%;height:auto;display:flex;align-items:center;justify-content:center;gap:12px}
  .time-pill,.count-pill{position:static}
  .time-pill{font-size:40px;height:68px;min-width:0;padding:0 22px;border-radius:18px}
  .count-pill{width:68px;height:68px}
  .title-pill{font-size:22px}
  .image-wrap{grid-area:image;padding:8px;border-radius:20px}
  .items{grid-area:items;flex-direction:row;padding:0;gap:4px}
  .flower{width:30px;height:46px}
  .flower svg{width:44px;height:30px}
  .flower.up svg{transform:rotate(-90deg)}
  .flower.down svg{transform:rotate(90deg)}
  .stage > *{margin-inline:16px}
  .item-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 2px}
  .item-pill{font-size:15px;padding:8px 14px}
  .desc{grid-area:desc;padding:8px 14px;max-height:none;overflow:visible}
  .desc summary{cursor:pointer}
  .desc summary::after{content:" ▸";font-size:13px}
  .desc[open] summary::after{content:" ▾"}
  .tabs{grid-area:tabs;position:static;flex-direction:row;gap:10px;pointer-events:auto}
  .tab-wrap{flex:1;position:static}
  .tab-wrap{flex:1}
  .tab-btn i{display:inline}
  .tab-btn{width:100%;border-radius:16px;padding:10px;letter-spacing:.05em;font-size:15px}
  .drawer,.tab-wrap.bottom .drawer{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;margin:0;border-radius:22px 22px 0 0;

/* ================= storage (IndexedDB with memory fallback) ================= */
const Store = {
  db: null, mem: {}, media: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('yoga-timer', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('media'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

  tx(store, mode, fn) {

  async get(k) { if (!this.db) return this.mem[k]; try { return await this.tx('kv', 'readonly', s => s.get(k)); } catch { return this.mem[k]; } },
  async set(k, v) { this.mem[k] = v; if (!this.db) return; try { await this.tx('kv', 'readwrite', s => s.put(v, k)); } catch {} },

  async getMedia(id) {

  },

  async delMedia(id) { this.media.delete(id); if (!this.db) return; try { await this.tx('media', 'readwrite', s => s.delete(id)); } catch {} },
};
const urlCache = new Map();
async function mediaURL(id) {
  if (!id) return null;
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await Store.getMedia(id); if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}

/* ================= data ================= */
const BUILTINS = [['vibrate', '內建震動'], ['bowl', '頌缽'], ['ding', '鈴聲'], ['wood', '木魚'], ['beep', '嗶聲'], ['tick', '滴答']];
const SYNTH_PERIOD = { vibrate: 5, bowl: 10, ding: 5, wood: 2, beep: 1, tick: 1 };

    mk('戰士二式', 'down', 60, 10, '左右各 30 秒，視線看向前方手指。'),
    mk('嬰兒式', 'down', 90, 10, '額頭貼地，讓呼吸回到自然的節奏。'),
    mk('攤屍式', 'down', 300, 10, '全身放鬆，閉上眼睛。', { during: 'bowl' }),
  ] };
  const t2 = { id: 'ex-t2', g: 'ex-g1', u: 0, name: '核心訓練（範例）', ratio: 1, globalSound: 'none', items: [
    mk('棒式', 'down', 30, 10, '身體成一直線，腹部收緊。', { during: 'tick' }),

  const t3 = { id: 'ex-t3', g: 'ex-g2', u: 0, name: '睡前伸展（範例）', ratio: 1, globalSound: 'none', items: [
    mk('坐姿前彎', 'down', 60, 10, ''),
    mk('仰臥扭轉', 'down', 60, 10, '左右各一次。'),
    mk('腹式呼吸', 'up', 0, 108, '一吸一吐算一次。'),
  ] };
  [t1, t2, t3].forEach((t, ti) => t.items.forEach((it, i) => { it.id = `ex-i${ti + 1}-${i + 1}`; }));
  return { v: 3,
    groups: [{ id: 'ex-g1', u: 0, name: '晨間練習', timerIds: [t1.id, t2.id], cur: 0 }, { id: 'ex-g2', u: 0, name: '放鬆', timerIds: [t3.id], cur: 0 }],
    timers: { [t1.id]: t1, [t2.id]: t2, [t3.id]: t3 }, sounds: defaultSounds(), currentTimerId: t1.id, settings: clone(DEFAULT_SETTINGS) };

const DEFAULT_SYNC = { mode: 'off', lastBackup: 0, lastImport: 0, lastSync: 0, remindDays: 7, lastRemind: 0, changedAt: 0, gClientId: '', gConnected: false };
/* bring any older/partial state up to v3 */
function migrate(s) {
  if (!s || !s.groups || !s.timers) return null;
  if (!Array.isArray(s.sounds)) s.sounds = defaultSounds();
  for (const [id, name] of BUILTINS) if (!s.sounds.some(x => x.id === id)) s.sounds.push({ id, name, kind: 'builtin', loop: true, plays: 1 });

  s.sync = Object.assign(clone(DEFAULT_SYNC), s.sync || {});

    document.body.append(s);

async function openComposer() {
  const it = selItem(); if (!it) return;
  showPage('compose'); $('#cLoad').hidden = false;
  try { await loadFabric(); } catch (e) { toast(e.message); showPage('edit'); return; }
  $('#cLoad').hidden = true;
  if (!C.cv) initCanvas();
  C.mediaIds = new Set(); C.dirty = false; C.hist = []; C.hi = -1; C.crop = null; $('#cropCtl').hidden = true;
  const sc = it.scene;
  C.aspect = sc && ASPECTS[sc.aspect] ? sc.aspect : '4:3'; $('#cAspect').value = C.aspect;
  [C.W, C.H] = ASPECTS[C.aspect];
  C.cv.clear(); C.cv.backgroundColor = (sc && sc.bg) || '#ffffff'; $('#cBg').value = C.cv.backgroundColor;
  fitCanvas();
  C.lock = true;
  if (sc && sc.json) {
    const json = JSON.parse(JSON.stringify(sc.json));
    for (const o of json.objects || []) if (o.type === 'image' && o.mediaId) { o.src = (await mediaURL(o.mediaId)) || ''; C.mediaIds.add(o.mediaId); }
    json.objects = (json.objects || []).filter(o => o.type !== 'image' || o.src);
    await new Promise(r => C.cv.loadFromJSON(json, r));
    C.cv.backgroundColor = sc.bg || '#ffffff';
  } else if (it.imageId) {
    await addImageObj(it.imageId, true);

  C.lock = false; C.cv.renderAll();

/* ================= sort mode: drag groups and timers ================= */
let SORT = false;
function sortGroupsHTML() {
  return S.groups.map(g => `<div class="group sorting" data-gid="${g.id}">
    <div class="group-top"><span class="ghandle" data-gdrag tabindex="0" role="button" aria-label="拖曳群組「${esc(g.name)}」，也可以用上下方向鍵移動">${I.handle}</span><span class="group-name"><span class="tx" data-fit="2">${esc(g.name)}</span></span></div>
    <div class="tlist sortable" data-gid="${g.id}">${g.timerIds.filter(id => S.timers[id]).map(id => `<div class="trow" data-tid="${id}"><span class="thandle" data-tdrag tabindex="0" role="button" aria-label="拖曳計時器「${esc(S.timers[id].name)}」，也可以用上下方向鍵移動">${I.handle}</span><span class="tx" data-fit="2">${esc(S.timers[id].name)}</span></div>`).join('')}<div class="tdrop">拖到這裡</div></div>
  </div>`).join('');
}
function enterSort() {
  if (SEL) exitSelect();

  if (S.settings.leftCollapsed) S.settings.leftCollapsed = false;

}
function exitSort() { if (!SORT) return; SORT = false; renderMain(); toast('已儲存順序'); }

function applySortFromDOM() {
  const gEls = [...$('#groupList').querySelectorAll('.group.sorting')];
  const order = gEls.map(x => x.dataset.gid);
  let changed = false;
  if (order.join() !== S.groups.map(g => g.id).join()) {
    S.groups = order.map(id => S.groups.find(g => g.id === id)).filter(Boolean);
    S.orderU = Date.now(); S.orderD = DEV; changed = true;
  }
  for (const gEl of gEls) {
    const g = S.groups.find(x => x.id === gEl.dataset.gid); if (!g) continue;
    const ids = [...gEl.querySelectorAll('.trow')].map(r => r.dataset.tid);
    if (ids.join() === g.timerIds.join()) continue;
    const curId = g.timerIds[g.cur];
    g.timerIds = ids; g.cur = Math.max(0, ids.indexOf(curId)); touch(g); changed = true;
    for (const id of ids) { const t = S.timers[id]; if (t && t.g !== g.id) { t.g = g.id; touch(t); } }
  }
  if (changed) { S.sync.changedAt = Date.now(); Sync.schedule(); save(); }
}
function initSortDrag() {
  let d = null;
  const list = () => $('#groupList');
  const tick = () => {
    if (!d) return; const r = list().getBoundingClientRect();
    if (d.y < r.top + 40) list().scrollTop -= 10; else if (d.y > r.bottom - 40) list().scrollTop += 10;
  };
  document.addEventListener('pointerdown', e => {
    if (!SORT) return;
    const gh = e.target.closest('[data-gdrag]'), th = e.target.closest('[data-tdrag]');
    if (!gh && !th) return;
    e.preventDefault(); e.stopPropagation();
    const el = gh ? gh.closest('.group') : th.closest('.trow');
    d = { kind: gh ? 'g' : 't', el, y: e.clientY, x: e.clientX, iv: setInterval(tick, 30) };
    el.classList.add('dragging'); (gh || th).setPointerCapture(e.pointerId);
  }, true);

    if (!d) return; d.x = e.clientX; d.y = e.clientY;

      const sibs = [...list().querySelectorAll('.group.sorting')].filter(x => x !== d.el);
      const before = sibs.find(x => { const b = x.getBoundingClientRect(); return d.y < b.top + b.height / 2; });
      if (d.el.nextElementSibling !== before) list().insertBefore(d.el, before || null);

      }
    }

  });
}

const SHORTCUTS = {
  main: [['空白鍵', '開始／暫停'], ['R', '重來'], ['↑ ／ ↓', '上一個／下一個項目'], ['1～9', '跳到第 N 個項目'], ['← ／ →', '同一群組的上一個／下一個計時器'],
    ['E', '編輯目前的計時器'], ['W', '開關碼表'], ['L', '碼表記錄一筆'], ['F', '全螢幕'], ['S', '進入／離開排序模式'], ['滑鼠雙擊項目', '切換到該項目並開始'], ['Esc', '關閉抽屜／返回'], ['? 或 F1', '顯示這份清單']],
  edit: [[MOD + ' + S', '儲存'], ['Esc', '返回（未儲存會先詢問）'], ['Alt + ↑ ／ ↓', '選上一個／下一個項目'], ['Alt + Shift + ↑ ／ ↓', '把目前項目上移／下移'],
    ['Alt + N', '新增計時項目'], ['Alt + C', '複製目前項目'], ['Alt + Delete', '刪除目前項目'], ['Alt + T', '切換倒數計時／計時器'], ['Alt + I', '打開圖片排版'],
    ['Alt + 1 ／ 2 ／ 3', '跳到標題／時間／說明'], ['↑ ／ ↓（時間、次數欄）', '加減 1，按住 Shift 加減 10'], [MOD + ' + B', '說明文字粗體'], [MOD + ' + Shift + > ／ <', '說明文字字級 +2 ／ −2'], ['F1（或不在輸入框時按 ?）', '顯示這份清單']],
  compose: [['V ／ P ／ T', '選取／畫筆／文字'], ['R ／ O ／ A ／ L', '方框／圓圈／箭頭／直線'], ['I', '加入圖片'], ['C', '裁切（Enter 套用、Esc 取消）'], ['Shift + R', '旋轉 90°'],
    ['] ／ [', '上移一層／下移一層'], ['方向鍵', '移動 1 點，Shift 一次 10 點'], [MOD + ' + C ／ V', '複製／貼上物件'], [MOD + ' + D', '原地複製'], ['Delete', '刪除選取'],
    [MOD + ' + Z ／ Y', '上一步／下一步'], [MOD + ' + Enter', '完成'], ['Esc', '取消'], ['? 或 F1', '顯示這份清單']],
  settings: [['空白鍵', '試聽／暫停'], ['↑ ／ ↓', '上一個／下一個音效'], ['Esc', '返回'], ['? 或 F1', '顯示這份清單']],
};
function showShortcuts() {
  const list = SHORTCUTS[page] || SHORTCUTS.main;
  const title = { main: '計時畫面', edit: '編輯計時器', compose: '圖片排版', settings: '設定' }[page] || '';
  dialog({ title: `快捷鍵：${title}`, body: `<table class="keys">${list.map(([k, v]) => `<tr><th><kbd>${esc(k)}</kbd></th><td>${esc(v)}</td></tr>`).join('')}</table><p class="hint">在輸入框打字時，只有 ${MOD}／Alt 組合鍵有作用。中文輸入法開著時，單一字母的快捷鍵可能被輸入法接走，請先切到英數模式；F1 隨時都能叫出這份清單。</p>`, buttons: [{ label: '知道了', value: 1, primary: true }] });
}
function moveTimerInGroup(dir) {
  const g = S.groups.find(x => x.timerIds.includes(S.currentTimerId)); if (!g || g.timerIds.length < 2) return;
  const i = (g.timerIds.indexOf(S.currentTimerId) + dir + g.timerIds.length) % g.timerIds.length;
  g.cur = i; selectTimer(g.timerIds[i]); toast(S.timers[g.timerIds[i]].name);
}
function editMoveItem(dir) {
  const items = E.draft.items, i = E.sel, j = i + dir; if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]]; E.sel = j; markDirty(); renderEdit();
}
function editDupItem() {
  const it = selItem(); if (!it) return;
  const cp = clone(it); cp.id = uid(); cp.title = (it.title || '未命名') + '（複製）';
  E.draft.items.splice(E.sel + 1, 0, cp); E.sel++; markDirty(); renderEdit(); toast('已複製項目');
}
function focusEdit(n) {
  if (isPortrait() && !E.detail) { E.detail = true; renderEdit(); }
  const el = n === 1 ? $('#eTitle') : n === 2 ? document.querySelector('#eForm .spin input') : $('#eDesc');
  if (el) { el.focus(); if (el.select) el.select(); }
}
function spinKey(e) {
  const inp = e.target; if (!inp.matches('.spin input') || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return false;
  e.preventDefault();
  const f = inp.dataset.f, d = (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1), it = selItem();
  if (/^c\d$/.test(f)) { it.count = clamp((it.count | 0) + d, 0, 999); markDirty(); renderEditForm(); }
  else applySpin(f, d);
  const again = document.querySelector(`#eForm .spin input[data-f="${f}"]`); if (again) { again.focus(); again.select(); }
  return true;
}
function toggleFullscreen() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch { toast('這個裝置不支援全螢幕'); }
}
function initShortcuts() {
  document.addEventListener('keydown', e => {
    if (e.key === 'F1') { e.preventDefault(); if (!document.querySelector('.scrim')) showShortcuts(); return; } // works even with a Chinese IME on
    if (e.defaultPrevented || e.isComposing || e.keyCode === 229) return; // typing Chinese with an IME
    if (document.querySelector('.scrim')) return;
    const el = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(el.tagName) || el.isContentEditable;
    const mod = isMac ? e.metaKey : e.ctrlKey, k = e.key, code = e.code;
    if (k === 'F1' || (!typing && (k === '?' || k === '？'))) { e.preventDefault(); showShortcuts(); return; }
    if (page === 'main') {
      if (typing || mod || e.altKey || SEL) return;
      if (SORT) { if (k.toLowerCase() === 's') { e.preventDefault(); exitSort(); } return; }
      const t = curTimer();
      if (k === ' ' && !el.closest('button')) { e.preventDefault(); ACT.toggle(); }
      else if (k === 'r' || k === 'R') ACT.reset();
      else if ((k === 'ArrowDown' || k === 'ArrowUp') && t && t.items.length && !el.closest('[data-gdrag],[data-tdrag],.splitter')) { e.preventDefault(); selectItem(clamp(R.idx + (k === 'ArrowDown' ? 1 : -1), 0, t.items.length - 1)); }
      else if (/^[1-9]$/.test(k) && t && +k <= t.items.length) selectItem(+k - 1);
      else if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); moveTimerInGroup(k === 'ArrowRight' ? 1 : -1); }
      else if ((k === 'e' || k === 'E') && t) openEdit(S.currentTimerId);
      else if (k === 'w' || k === 'W') setDrawer('sw');
      else if ((k === 'l' || k === 'L') && (openDrawer === 'sw' || S.sw.running)) swAct('lap');
      else if (k === 'f' || k === 'F') toggleFullscreen();
      else if (k === 's' || k === 'S') enterSort();
      return;
    }
    if (page === 'edit') {
      if (mod && code === 'KeyS') { e.preventDefault(); ACT.save(); return; }
      if (mod && e.shiftKey && (code === 'Period' || code === 'Comma') && el.closest('#eDesc')) { e.preventDefault(); ACT[code === 'Period' ? 'rtSizeUp' : 'rtSizeDn'](); return; }
      if (spinKey(e)) return;
      if (!e.altKey || mod) return;
      const act = {
        ArrowUp: () => e.shiftKey ? editMoveItem(-1) : (E.sel > 0 && (stopPv(), E.sel--, renderEdit())),
        ArrowDown: () => e.shiftKey ? editMoveItem(1) : (E.sel < E.draft.items.length - 1 && (stopPv(), E.sel++, renderEdit())),
        KeyN: () => ACT.addItem(), KeyC: () => editDupItem(),
        Delete: () => { const it = selItem(); if (it) confirmDelete('item', [it.id]); },
        Backspace: () => { const it = selItem(); if (it) confirmDelete('item', [it.id]); },
        KeyT: () => { const it = selItem(); if (it) ACT.setMode({ dataset: { m: it.mode === 'down' ? 'up' : 'down' } }); },
        KeyI: () => openComposer(),
        Digit1: () => focusEdit(1), Digit2: () => focusEdit(2), Digit3: () => focusEdit(3),
      }[code];
      if (act) { e.preventDefault(); act(); }
      return;
    }
    if (page === 'settings') {
      if (typing || mod || e.altKey || SV.view !== 'sound') return;
      if (k === ' ') { e.preventDefault(); if (prev.el && prev.id === SV.sel && !prev.el.paused) prev.el.pause(); else previewPlay(); }
      else if (k === 'ArrowUp' || k === 'ArrowDown') {
        e.preventDefault(); const i = clamp(sndIndex(SV.sel) + (k === 'ArrowDown' ? 1 : -1), 0, S.sounds.length - 1);
        stopPreview(); SV.sel = S.sounds[i].id; renderSettings();
      }
    }
  }, true);
  // double-click an item: jump to it and start
  $('#itemList').addEventListener('dblclick', e => { const b = e.target.closest('.item-pill'); if (!b) return; selectItem(+b.dataset.i); if (!R.running) play(); });
}

/* ================= boot ================= */
(async () => {
  await Store.open();
  let saved = null; try { saved = await Store.get('state'); } catch {}
  try { DEV = await Store.get('device'); } catch {}
  if (!DEV) { DEV = 'd-' + uid(); await Store.set('device', DEV); }
  S = migrate(saved) || migrate(seed());
  if (saved && S.appVer !== '3.2') { // keep a copy of the data as it was before this update
    try { await Store.set('backup-pre-3.2', { at: Date.now(), snap: await buildSnapshot(false) }); } catch {}
    S.appVer = '3.2';
  } else if (!saved) S.appVer = '3.2';
  if (!S.timers[S.currentTimerId]) { const g = S.groups.find(g => g.timerIds.length); S.currentTimerId = g ? g.timerIds[0] : null; }
  save();
  if (!S.sw) S.sw = SWdef();
  buildShell(); bindEvents(); initDrag(); initBackHandle(); initDeleteGestures(); initFloatTabs(); initSplitter(); bindComposer(); initFullText(); initSortDrag(); initShortcuts();
  $('#desc').open = !isPortrait();
  showPage('main'); renderMain();
  setInterval(loop, 100);
  setTimeout(cleanMedia, 3000);
  if (S.sync.mode !== 'off') setTimeout(() => Sync.run(false), 1200);
  setTimeout(checkRemind, 4000); setInterval(checkRemind, 3600e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Sync.schedule(600); checkRemind(); } });
  addEventListener('online', () => Sync.schedule(600));
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
})();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js')}</script>
